# Header di sicurezza per la SPA (l'API ha i suoi via Spring Security). NB nginx: un add_header
# dentro una location SOSTITUISCE tutti quelli ereditati dal blocco server - per questo i base
# header sono ripetuti nelle location che ne aggiungono altri.
#
# CSP: script solo dal bundle ('self'); style con 'unsafe-inline' (obbligatorio per gli stili
# dei componenti Angular); connect-src include l'API (localhost:8080 in sviluppo docker - in
# produzione va sostituito con l'origin reale del backend); frame-src consente l'embed Cal.com
# nella pagina Calendario.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # form pubblico di lead capture: DEVE restare incorporabile via iframe da siti terzi
    # (frame-ancestors *), a differenza del resto dell'app
    location /f/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8080; frame-ancestors *" always;
        try_files $uri /index.html;
    }

    # SPA Angular: ogni rotta lato client (es. /o/contact, /settings) deve servire index.html,
    # il router Angular si occupa del resto. Senza questo, un refresh su una rotta profonda
    # darebbe 404 da nginx.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:8080; frame-src https://cal.com https://*.cal.com; frame-ancestors 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # asset con hash nel nome: cache lunga
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
