<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NorthLeap CRM</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="logo_minimale_con_bussola_stilizzata-removebg-preview.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // applicato prima del bootstrap di Angular per evitare un flash del tema sbagliato -
    // ThemeService (src/app/services/theme.service.ts) prende il controllo dopo, stessa chiave
    // localStorage
    (function () {
      var stored = localStorage.getItem('theme');
      var theme = (stored === 'light' || stored === 'dark')
        ? stored
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <div id="google_translate_element" style="position:fixed;bottom:8px;left:8px;z-index:50"></div>
  <script src="gtranslate-init.js"></script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
</body>
</html>
