@if (isAuthenticated()) {
  <div class="drawer lg:drawer-open min-h-screen">
    <input id="app-drawer" type="checkbox" class="drawer-toggle" />

    <div class="drawer-content flex flex-col">
      <app-topbar />
      <main class="flex-1 p-4 lg:p-6">
        <router-outlet />
      </main>
    </div>

    <app-sidebar />
  </div>
  <app-command-palette />
} @else {
  <button class="fixed top-3 right-3 z-50 p-2 cursor-pointer" (click)="i18n.toggle()" aria-label="Lingua">
    <lucide-icon [img]="Languages" [size]="18" />
  </button>
  <router-outlet />
}

<ui-toasts />
<ui-confirm-dialog />
