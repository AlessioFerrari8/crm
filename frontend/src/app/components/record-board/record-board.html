<div class="flex gap-3 overflow-x-auto pb-4" [class.opacity-60]="saving()">
  @for (g of groups(); track g.value) {
    <div class="w-64 shrink-0 bg-base-200/50 rounded-box p-2 transition"
         [class.ring-2]="dragOver() === g.value"
         [class.ring-primary]="dragOver() === g.value"
         (dragover)="onDragOver($event, g.value)"
         (dragleave)="dragOver() === g.value && dragOver.set(null)"
         (drop)="onDrop(g.value)">
      <div class="mb-2 flex items-center gap-2 px-1 text-sm font-medium">
        <span class="badge badge-ghost badge-sm gap-1.5">
          <span class="inline-block w-2 h-2 rounded-full" [style.background-color]="g.color || 'currentColor'"></span>
          {{ g.label }}
        </span>
        <span class="text-base-content/50">{{ g.records.length }}</span>
        @if (g.total !== null && g.total > 0) {
          <span class="ml-auto text-xs font-semibold text-base-content/60">{{ formatTotal(g.total) }}</span>
        }
      </div>

      <div class="space-y-2 min-h-16">
        @for (rec of g.records; track rec.id) {
          <a [routerLink]="['/o', objectKey(), rec.id]"
             draggable="true"
             (dragstart)="onDragStart(rec)"
             (dragend)="onDragEnd()"
             class="card card-sm bg-base-100 border border-base-300 p-3 text-sm block hover:border-base-content/30 hover:shadow-sm transition cursor-grab active:cursor-grabbing"
             [class.border-l-4]="isStale(rec)"
             [class.border-l-error]="isStale(rec)"
             [title]="isStale(rec) ? 'Fermo da ' + staleDays(rec) + ' giorni' : ''">
            {{ rec.title }}
            @if (isStale(rec)) {
              <div class="mt-1 text-[10px] text-error">fermo da {{ staleDays(rec) }} giorni</div>
            }
          </a>
        } @empty {
          <div class="text-center text-xs text-base-content/30 py-4">Nessun record</div>
        }
      </div>
    </div>
  }
</div>
