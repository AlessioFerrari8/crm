<div class="min-h-screen flex items-center justify-center bg-base-200 p-4">
  <div class="w-full max-w-sm">
    <ui-card>
      <h1 class="text-xl font-semibold mb-3">{{ i18n.t('verify.title') }}</h1>

      @switch (state()) {
        @case ('loading') {
          <p class="text-sm text-base-content/60">{{ i18n.t('verify.loading') }}</p>
        }
        @case ('ok') {
          <p class="text-sm mb-4">{{ i18n.t('verify.ok') }}</p>
          <a routerLink="/login" class="btn btn-primary rounded-sm">{{ i18n.t('verify.goLogin') }}</a>
        }
        @case ('error') {
          <p class="text-sm mb-4">{{ i18n.t('verify.invalid') }}</p>
          <p class="text-xs text-base-content/60">
            {{ i18n.t('verify.hint') }}
          </p>
        }
      }
    </ui-card>
  </div>
</div>
