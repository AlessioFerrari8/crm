services:
  postgres-db:
    image: postgres:16-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: crm_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # estensioni (pg_trgm) create come superuser alla prima inizializzazione del volume:
      # vedi la nota dentro il file per il caso "volume gia' esistente"
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: crm-backend
    container_name: crm-backend
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # sovrascrivono i valori di backend/.env: dentro la rete docker il database e' raggiungibile
      # come "postgres-db:5432" (porta interna, non l'host-mapped 5433) con le credenziali del
      # servizio postgres-db sopra, non quelle del Postgres locale usato da bootRun
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/crm_db
      DB_USERNAME: user
      DB_PASSWORD: user
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    volumes:
      # allegati caricati dagli utenti (app.files.upload-dir, default ./uploads sotto /app)
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: crm-frontend
    container_name: crm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # origin del backend, finisce nella connect-src della CSP di nginx.conf.template.
      # In produzione va l'origin reale, altrimenti la SPA non parla con l'API e l'SSE non apre.
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8080}
      # limita envsubst alla sola API_ORIGIN: senza, sostituirebbe anche $uri e $host di nginx
      NGINX_ENVSUBST_FILTER: "^API_ORIGIN$$"
    # nginx serve il bundle statico sulla 80, mappata sulla 4200 dell'host
    ports:
      - "4200:80"

volumes:
  postgres_data:
  uploads_data:
