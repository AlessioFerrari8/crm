spring.application.name=backend

app.jwt.jwt_access_secret=${JWT_ACCESS_SECRET}
app.jwt.jwt_refresh_secret=${JWT_REFRESH_SECRET}
app.jwt.expiration-access-ms=900000
app.jwt.expiration-refresh-ms=2592000000
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.url=jdbc:postgresql://localhost:5433/crm_db

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Workflow engine (Fase 5): azione send_email via Resend. Niente default hardcoded per
# from-email (l'originale usa un dominio personale dell'autore come default letterale) - se
# vuota, l'azione si skippa, stesso esito pratico del caso "niente api-key" gia' previsto.
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:}

app.workflow.executor.core-pool-size=${WORKFLOW_EXECUTOR_CORE_POOL_SIZE:2}
app.workflow.executor.max-pool-size=${WORKFLOW_EXECUTOR_MAX_POOL_SIZE:8}
app.workflow.executor.queue-capacity=${WORKFLOW_EXECUTOR_QUEUE_CAPACITY:100}

# Files (Fase 6): stesso limite dell'originale (25 MB lato Multer)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.files.upload-dir=${UPLOAD_DIR:./uploads}

# CORS: origini ammesse per il frontend, separate da virgola, mai wildcard (le richieste
# includono credenziali). Default per lo sviluppo locale Angular.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Rate limiting in-memory per IP su login/refresh/accept-invite (single-instance, vedi RateLimiter)
app.rate-limit.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:10}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# Cookie auth (access_token/refresh_token httpOnly, vedi AuthCookieService): "Secure" richiede
# HTTPS, va lasciato false in sviluppo locale (http://localhost) e messo a true in produzione.
app.security.cookie-secure=${COOKIE_SECURE:false}
app.security.cookie-samesite=${COOKIE_SAMESITE:Lax}

# Swagger UI / OpenAPI: pubblici (permitAll in SecurityConfig), utili in sviluppo. In produzione
# spegnerli con SWAGGER_ENABLED=false (la UI e lo spec rispondono 404).
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Integrazione Cal.com: secret del webhook (Impostazioni -> Developers -> Webhooks su cal.com,
# stesso valore qui e la). Vuoto = endpoint /api/integrations/calcom/webhook spento (404).
app.calcom.webhook-secret=${CALCOM_WEBHOOK_SECRET:}

# scheduler: l'heartbeat SSE e il cron orario del workflow engine condividono
# il TaskScheduler di Spring, che di default ha 1 solo thread. Un send() bloccato
# su un client fermo blocherebbe anche i workflow schedulati.
spring.task.scheduling.pool.size=3


# base URL frontend, ci serve per costruire il link di invito delle mail, invito, notifiche ecc
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}

# Email: quale trasporto usare (resend | smtp). Vuoto = invio email disattivato.
app.mail.provider=${MAIL_PROVIDER:}
# Mittente del trasporto SMTP: di norma DEVE coincidere con la mailbox autenticata.
app.mail.from=${MAIL_FROM:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
# senza timeout espliciti JavaMail aspetta all'infinito, e l'invito e' sincrono
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# chiave di cifratura dei segreti a riposo (TOTP, password IMAP delle caselle)
# 32 byte base64: openssl rand -base64 32. Nessun default
app.crypto.secret-key=${MFA_SECRET_KEY}

# mailscanner: intervallo fra due giri (dalla fine del precedente)
app.mailscanner.delay-ms=${MAILSCANNER_DELAY_MS:120000}

# fattura elettronica: manual = il file si scarica e si carica a mano sul portale del provider
app.sdi.provider=${SDI_PROVIDER:manual}

# campagne: messaggi al minuto e URL pubblico del backend (link di tracking e disiscrizione nelle email)
app.campaign.batch-per-minute=${CAMPAIGN_BATCH_PER_MINUTE:60}
app.public-api-url=${PUBLIC_API_URL:http://localhost:8080}

# firma dei link di accettazione dei preventivi. Senza default: un segreto noto rende falsificabili i link
app.quote.accept-secret=${QUOTE_ACCEPT_SECRET}

