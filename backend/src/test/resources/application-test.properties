# Profilo "test": sovrascrive le sole chiavi che in application.properties sono placeholder
# senza default (i secret JWT) o che non hanno senso contro un container usa e getta.
# Deve restare un file di profilo: un application.properties nel classpath dei test
# rimpiazzerebbe in blocco quello di main invece di sovrascriverlo chiave per chiave.
#
# Datasource: nessuna riga qui, la fornisce @ServiceConnection in AbstractIntegrationTest.

# Valori fissi, validi solo per i test. JwtService fa Decoders.BASE64.decode + hmacShaKeyFor,
# quindi devono essere base64 validi da almeno 32 byte, altrimenti jjwt tira WeakKeyException.
app.jwt.jwt_access_secret=/1s0az4nvOu1YNPw1+37DfvgKPG/20N0kLSkRWr+2ezmtDNs6SbmRxOV4llKb8kS
app.jwt.jwt_refresh_secret=bFV98MRa8ord+aIwRHrOu5JED7fRvFUZTozw8AD5N/XWR+SNxozszEw5BTPQfYjq

# Il container e' nuovo ad ogni run: "create" costruisce lo schema da zero dalle entities,
# senza le migrazioni incrementali che "update" farebbe su un DB gia' popolato.
# Non "create-drop": il drop gira a JVM in chiusura, quando Testcontainers ha gia' spento il
# container, e Hikari resta appeso 30s sul timeout prima di rinunciare. Il container si butta
# comunque, lo schema non va ripulito a mano.
spring.jpa.hibernate.ddl-auto=create

# Niente upload nel working tree del progetto.
app.files.upload-dir=${java.io.tmpdir}/crm-test-uploads

# Nessun trasporto email attivo: EmailService non deve provare a parlare con SMTP o Resend.
app.mail.provider=

# SecretCipher (MFA, caselle IMAP): AES-256, 32 byte in base64. Senza, il context dei test non si alza
app.crypto.secret-key=I/9Dwk79ZmEW8GfkJDE0w0EwqKHbH/hgMVpLv+VGEkw=

# firma dei link di accettazione, valore fisso per i test
app.quote.accept-secret=test-quote-accept-secret