plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'it.northleap'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Testcontainers: il solo test che carica il contesto Spring completo ha bisogno di un
    // Postgres vero (l'engine metadata-driven usa jsonb ovunque, H2 non e' un'alternativa).
    // Un container usa e getta al posto del DB del compose: la suite resta autonoma e la DDL
    // di Hibernate + i seeder girano su uno schema vergine ad ogni run.
    // il BOM di Spring Boot 4 non gestisce piu' le versioni di Testcontainers: va importato il loro
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    // Testcontainers 2.x ha rinominato i moduli: prima erano :junit-jupiter e :postgresql
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // springdoc-openapi: genera lo spec OpenAPI 3 dai controller e monta la Swagger UI.
    // La linea 3.0.x e' quella allineata a Spring Boot 4 / Spring Framework 7 / Jackson 3.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // pdf: Thymeleaf rende il template HTML, openhtmltopdf lo stampa
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // Template non-Spring (PdfTemplateConfig) valuta le espressioni con OGNL
    implementation 'ognl:ognl:3.3.4'
    implementation 'io.github.openhtmltopdf:openhtmltopdf-pdfbox:1.1.28'
    implementation 'io.github.openhtmltopdf:openhtmltopdf-slf4j:1.1.28'

    // jsoup: openhtmltopdf vuole XML ben formato, l'HTL di un utente non lo è
    implementation 'org.jsoup:jsoup:1.18.1'

}

tasks.named('test') {
    useJUnitPlatform()
}

// javac usa il charset di default della piattaforma se non specificato esplicitamente —
// su Windows non è UTF-8, e corrompe le stringhe non-ASCII nel sorgente (es. "Opportunità")
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
